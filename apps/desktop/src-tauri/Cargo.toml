[package]
name = "bioentropy-desktop"
version = "0.1.0"
description = "Bioentropy lab 2FA thin client (desktop)"
authors = ["Bioentropy"]
edition = "2021"

[lib]
name = "bioentropy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
hex = "0.4"
local-ip-address = "0.6"
qrcode = "0.14"
dirs = "6"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tower = "0.5"
sha3 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
